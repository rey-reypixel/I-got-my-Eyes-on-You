<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 480" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1080" height="480" fill="#ffffff"/>

  <text x="20" y="28" font-size="13" fill="#2c3e6b" font-weight="bold">Path A &#8212; always running</text>

  <!-- Path A boxes -->
  <rect x="20" y="42" width="150" height="50" rx="6" fill="#eef1fb" stroke="#2c3e6b" stroke-width="1.6"/>
  <text x="95" y="63" text-anchor="middle" font-size="11.5" fill="#111">Centroid position</text>
  <text x="95" y="78" text-anchor="middle" font-size="11.5" fill="#111">(per frame)</text>

  <line x1="170" y1="67" x2="204" y2="67" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="206" y="42" width="160" height="50" rx="6" fill="#eef1fb" stroke="#2c3e6b" stroke-width="1.6"/>
  <text x="286" y="63" text-anchor="middle" font-size="11.5" fill="#111">Normalize by height</text>
  <text x="286" y="78" text-anchor="middle" font-size="10" fill="#555">(perspective-corrected)</text>

  <line x1="366" y1="67" x2="400" y2="67" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="402" y="34" width="180" height="66" rx="6" fill="#eef1fb" stroke="#2c3e6b" stroke-width="1.6"/>
  <text x="492" y="58" text-anchor="middle" font-size="11.5" fill="#111">Statistical-outlier check</text>
  <text x="492" y="73" text-anchor="middle" font-size="10" fill="#555">vs. rolling per-person</text>
  <text x="492" y="87" text-anchor="middle" font-size="10" fill="#555">velocity baseline</text>

  <line x1="582" y1="67" x2="616" y2="67" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="618" y="42" width="190" height="50" rx="6" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
  <text x="713" y="71" text-anchor="middle" font-size="12" fill="#111" font-weight="bold">kinematic_suspicious_flag</text>

  <!-- Path B -->
  <text x="20" y="168" font-size="13" fill="#6b3fa0" font-weight="bold">Path B &#8212; gated (only runs when triggered)</text>

  <rect x="20" y="182" width="180" height="60" rx="6" fill="#f6effa" stroke="#6b3fa0" stroke-width="1.6"/>
  <text x="110" y="207" text-anchor="middle" font-size="11.5" fill="#111">Centroid stationary</text>
  <text x="110" y="222" text-anchor="middle" font-size="11.5" fill="#111">&#8805; threshold frames?</text>

  <!-- Decision diamond -->
  <polygon points="240,212 300,182 360,212 300,242" fill="#fff3e0" stroke="#a66a00" stroke-width="1.8"/>
  <text x="300" y="208" text-anchor="middle" font-size="10.5" fill="#7a4d00">gate</text>
  <text x="300" y="221" text-anchor="middle" font-size="10.5" fill="#7a4d00">open?</text>

  <line x1="200" y1="212" x2="238" y2="212" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="362" y1="212" x2="398" y2="212" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="380" y="200" text-anchor="middle" font-size="10.5" fill="#7a4d00" font-weight="bold">yes</text>
  <text x="300" y="266" text-anchor="middle" font-size="10.5" fill="#999" font-style="italic">no &#8594; re-check next frame, no inference cost paid</text>

  <rect x="400" y="182" width="170" height="60" rx="6" fill="#f6effa" stroke="#6b3fa0" stroke-width="1.6"/>
  <text x="485" y="207" text-anchor="middle" font-size="11.5" fill="#111">Extract short</text>
  <text x="485" y="222" text-anchor="middle" font-size="11.5" fill="#111">person-centered clip</text>

  <line x1="570" y1="212" x2="604" y2="212" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="606" y="176" width="210" height="72" rx="6" fill="#f6effa" stroke="#6b3fa0" stroke-width="1.9"/>
  <text x="711" y="201" text-anchor="middle" font-size="12" fill="#111" font-weight="bold">LoRA-fine-tuned</text>
  <text x="711" y="217" text-anchor="middle" font-size="12" fill="#111" font-weight="bold">VideoMAE classifier</text>
  <text x="711" y="234" text-anchor="middle" font-size="9.5" fill="#555" font-style="italic">replaces earlier hand-tuned</text>
  <text x="711" y="245" text-anchor="middle" font-size="9.5" fill="#555" font-style="italic">keypoint-variance heuristic</text>

  <line x1="816" y1="212" x2="850" y2="212" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="852" y="187" width="200" height="50" rx="6" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
  <text x="952" y="216" text-anchor="middle" font-size="12" fill="#111" font-weight="bold">learned_suspicious_flag</text>

  <!-- Converge into state resolution -->
  <line x1="713" y1="92" x2="713" y2="330" stroke="#222" stroke-width="1.5"/>
  <line x1="952" y1="237" x2="952" y2="330" stroke="#222" stroke-width="1.5"/>
  <line x1="713" y1="330" x2="952" y2="330" stroke="#222" stroke-width="1.5"/>
  <line x1="833" y1="330" x2="833" y2="360" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- State resolution box -->
  <rect x="463" y="362" width="740" height="106" rx="8" fill="#f5f5f7" stroke="#222" stroke-width="1.8"/>
  <text x="833" y="384" text-anchor="middle" font-size="13" fill="#111" font-weight="bold">Fixed-priority state resolution (once per frame, per person)</text>
  <text x="500" y="406" font-size="12" fill="#111">1. intruder_flag &#8594; INTRUDER</text>
  <text x="500" y="424" font-size="12" fill="#111">2. panic_flag &#8594; PANIC</text>
  <text x="500" y="442" font-size="12" fill="#111">3. kinematic_suspicious_flag OR learned_suspicious_flag &#8594; SUSPICIOUS_ACTIVITY</text>
  <text x="500" y="460" font-size="12" fill="#111">4. otherwise &#8594; NORMAL</text>

  <text x="20" y="330" font-size="11" fill="#555" font-style="italic">Gate is the key element: it's what makes Path B compute-gated, not always-on (Sec. III-D, &lt;1% overhead figure, Sec. V-B).</text>
</svg>
