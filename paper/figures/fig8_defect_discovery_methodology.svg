<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="320" fill="#ffffff"/>

  <!-- Box 0 -->
  <rect x="20" y="50" width="170" height="80" rx="6" fill="#ffffff" stroke="#222" stroke-width="1.6"/>
  <text x="105" y="78" text-anchor="middle" font-size="10.5" fill="#111">Symptom observed</text>
  <text x="105" y="93" text-anchor="middle" font-size="10.5" fill="#111">(synthetic scenario OR</text>
  <text x="105" y="108" text-anchor="middle" font-size="10.5" fill="#111">real footage)</text>

  <line x1="190" y1="90" x2="216" y2="90" stroke="#222" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Box 1 -->
  <rect x="218" y="42" width="180" height="96" rx="6" fill="#eef1fb" stroke="#2c3e6b" stroke-width="1.8"/>
  <text x="308" y="66" text-anchor="middle" font-size="10.5" fill="#111" font-weight="bold">Frame-by-frame</text>
  <text x="308" y="81" text-anchor="middle" font-size="10.5" fill="#111" font-weight="bold">instrumentation</text>
  <text x="308" y="98" text-anchor="middle" font-size="9" fill="#333">(real footage only &#8212; NOT</text>
  <text x="308" y="111" text-anchor="middle" font-size="9" fill="#333">visual inspection alone)</text>
  <text x="308" y="126" text-anchor="middle" font-size="8.5" fill="#555" font-style="italic">the paper's methodological claim</text>

  <line x1="398" y1="90" x2="424" y2="90" stroke="#222" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Box 2 -->
  <rect x="426" y="50" width="150" height="80" rx="6" fill="#ffffff" stroke="#222" stroke-width="1.6"/>
  <text x="501" y="94" text-anchor="middle" font-size="11" fill="#111">Root cause</text>
  <text x="501" y="110" text-anchor="middle" font-size="11" fill="#111">identified</text>

  <line x1="576" y1="90" x2="602" y2="90" stroke="#222" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Box 3 -->
  <rect x="604" y="50" width="180" height="80" rx="6" fill="#ffffff" stroke="#222" stroke-width="1.6"/>
  <text x="694" y="86" text-anchor="middle" font-size="11" fill="#111">Fix implemented +</text>
  <text x="694" y="102" text-anchor="middle" font-size="11" fill="#111">regression test added</text>

  <line x1="784" y1="90" x2="810" y2="90" stroke="#222" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Box 4 -->
  <rect x="812" y="42" width="190" height="96" rx="6" fill="#fff6e6" stroke="#a66a00" stroke-width="1.8"/>
  <text x="907" y="76" text-anchor="middle" font-size="11" fill="#111" font-weight="bold">Re-verify against the</text>
  <text x="907" y="92" text-anchor="middle" font-size="11" fill="#111" font-weight="bold">SAME real footage</text>
  <text x="907" y="112" text-anchor="middle" font-size="9" fill="#7a4d00" font-style="italic">not just the unit-test suite</text>

  <line x1="1002" y1="90" x2="1028" y2="90" stroke="#222" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1015" y="76" text-anchor="middle" font-size="9.5" fill="#1c4a35" font-weight="bold">sufficient</text>

  <!-- Box 5 -->
  <rect x="1030" y="50" width="150" height="80" rx="6" fill="#eaf3ee" stroke="#2e7d5b" stroke-width="1.8"/>
  <text x="1105" y="84" text-anchor="middle" font-size="10.5" fill="#111" font-weight="bold">Fix accepted,</text>
  <text x="1105" y="100" text-anchor="middle" font-size="10.5" fill="#111" font-weight="bold">added to Table I</text>

  <!-- Loop-back path: from Box4 down and back to Box1 -->
  <path d="M 907,138 L 907,220 L 308,220 L 308,140" fill="none" stroke="#b3261e" stroke-width="1.8" stroke-dasharray="7,4" marker-end="url(#arrowRed)"/>
  <text x="607" y="212" text-anchor="middle" font-size="11.5" fill="#b3261e" font-weight="bold">Insufficient? Back to instrumentation.</text>
  <text x="607" y="230" text-anchor="middle" font-size="10" fill="#7a1a15" font-style="italic">Happened twice on the same finding (Sec. IV-D) &#8212; a real path, not hypothetical.</text>

  <rect x="20" y="256" width="1160" height="40" rx="6" fill="#f4f4f7" stroke="#666" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="600" y="280" text-anchor="middle" font-size="11.5" fill="#333">A synthetic-test-only workflow would plausibly have shipped each interim fix as complete.</text>

  <text x="20" y="316" font-size="12" fill="#111">Fig. 8. Real-footage defect-discovery methodology. One finding (Section IV-D) was found insufficient at the re-verification step twice.</text>
</svg>
