<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="560" fill="#ffffff"/>

  <!-- ============ Main pipeline row ============ -->
  <!-- Video Input -->
  <rect x="20" y="70" width="120" height="52" rx="6" fill="#ffffff" stroke="#222" stroke-width="1.6"/>
  <text x="80" y="101" text-anchor="middle" font-size="15" fill="#111">Video Input</text>

  <line x1="140" y1="96" x2="180" y2="96" stroke="#222" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Letterbox Preprocessing -->
  <rect x="182" y="60" width="150" height="72" rx="6" fill="#ffffff" stroke="#222" stroke-width="1.6"/>
  <text x="257" y="92" text-anchor="middle" font-size="14" fill="#111">Letterbox</text>
  <text x="257" y="110" text-anchor="middle" font-size="14" fill="#111">Preprocessing</text>
  <text x="257" y="126" text-anchor="middle" font-size="11" fill="#555" font-style="italic">Sec. III-E</text>

  <line x1="332" y1="96" x2="372" y2="96" stroke="#222" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Detection + Tracking -->
  <rect x="374" y="52" width="220" height="88" rx="6" fill="#eef1fb" stroke="#2c3e6b" stroke-width="1.8"/>
  <text x="484" y="82" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">YOLO26 Detection +</text>
  <text x="484" y="100" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">BoT-SORT + Re-ID</text>
  <text x="484" y="117" text-anchor="middle" font-size="11" fill="#555">Association</text>
  <text x="484" y="133" text-anchor="middle" font-size="11" fill="#555" font-style="italic">Sec. III-A</text>

  <!-- Branch out to three objectives -->
  <line x1="594" y1="96" x2="630" y2="96" stroke="#222" stroke-width="1.6"/>
  <line x1="630" y1="30" x2="630" y2="220" stroke="#222" stroke-width="1.6"/>
  <line x1="630" y1="30"  x2="660" y2="30"  stroke="#222" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="630" y1="96"  x2="660" y2="96"  stroke="#222" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="630" y1="200" x2="660" y2="200" stroke="#222" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Objective 1 -->
  <rect x="662" y="8" width="200" height="44" rx="6" fill="#ffffff" stroke="#2c3e6b" stroke-width="1.6"/>
  <text x="762" y="27" text-anchor="middle" font-size="12.5" fill="#111">Obj. 1: Unauthorized Access</text>
  <text x="762" y="42" text-anchor="middle" font-size="10.5" fill="#555" font-style="italic">ROI polygon test &#8226; rule-based &#8226; III-B</text>

  <!-- Objective 2 -->
  <rect x="662" y="74" width="200" height="44" rx="6" fill="#ffffff" stroke="#2c3e6b" stroke-width="1.6"/>
  <text x="762" y="93" text-anchor="middle" font-size="12.5" fill="#111">Obj. 2: Abandoned Objects</text>
  <text x="762" y="108" text-anchor="middle" font-size="10.5" fill="#555" font-style="italic">3-state machine &#8226; rule-based &#8226; III-C</text>

  <!-- Objective 3 (hybrid: rule + learned) -->
  <rect x="662" y="178" width="200" height="52" rx="6" fill="#f6effa" stroke="#6b3fa0" stroke-width="1.8"/>
  <text x="762" y="198" text-anchor="middle" font-size="12.5" fill="#111">Obj. 3: Suspicious Activity</text>
  <text x="762" y="212" text-anchor="middle" font-size="10.5" fill="#555">kinematic + gated LoRA-tuned</text>
  <text x="762" y="224" text-anchor="middle" font-size="10.5" fill="#555" font-style="italic">VideoMAE &#8226; hybrid &#8226; III-D</text>

  <!-- Converge to Overlay Rendering -->
  <line x1="862" y1="30"  x2="900" y2="30"  stroke="#222" stroke-width="1.6"/>
  <line x1="862" y1="96"  x2="900" y2="96"  stroke="#222" stroke-width="1.6"/>
  <line x1="862" y1="204" x2="900" y2="204" stroke="#222" stroke-width="1.6"/>
  <line x1="900" y1="30" x2="900" y2="204" stroke="#222" stroke-width="1.6"/>
  <line x1="900" y1="117" x2="936" y2="117" stroke="#222" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="938" y="80" width="90" height="74" rx="6" fill="#ffffff" stroke="#222" stroke-width="1.6"/>
  <text x="983" y="112" text-anchor="middle" font-size="13" fill="#111">Overlay</text>
  <text x="983" y="128" text-anchor="middle" font-size="13" fill="#111">Rendering</text>

  <!-- ============ Decoupled side branch (event log / MCP / optional LLM) ============ -->
  <line x1="900" y1="117" x2="900" y2="330" stroke="#666" stroke-width="1.4" stroke-dasharray="5,3"/>
  <line x1="900" y1="330" x2="862" y2="330" stroke="#666" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrowGray)"/>

  <rect x="700" y="304" width="160" height="52" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.4"/>
  <text x="780" y="326" text-anchor="middle" font-size="12.5" fill="#111">Event Log</text>
  <text x="780" y="341" text-anchor="middle" font-size="10.5" fill="#555">(SQLite)</text>

  <line x1="700" y1="330" x2="490" y2="330" stroke="#555" stroke-width="1.4" marker-end="url(#arrowGray)"/>
  <text x="595" y="322" text-anchor="middle" font-size="9.5" fill="#777">write-only, fire-and-forget</text>

  <rect x="330" y="304" width="160" height="52" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.4"/>
  <text x="410" y="326" text-anchor="middle" font-size="12.5" fill="#111">MCP Server</text>
  <text x="410" y="341" text-anchor="middle" font-size="10.5" fill="#555" font-style="italic">read-only &#8226; III-G</text>

  <line x1="330" y1="330" x2="180" y2="330" stroke="#999" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrowGray)"/>

  <rect x="20" y="304" width="160" height="52" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.4" stroke-dasharray="6,4"/>
  <text x="100" y="326" text-anchor="middle" font-size="12.5" fill="#555">LLM Triage</text>
  <text x="100" y="341" text-anchor="middle" font-size="10" fill="#777">(Claude, not yet built)</text>

  <text x="20" y="400" font-size="11" fill="#555" font-style="italic">No shared process or thread between the live pipeline and the MCP server (Sec. III-G).</text>
  <text x="20" y="416" font-size="11" fill="#777" font-style="italic">Dashed LLM Triage box = infrastructure-ready, not yet exercised (see Diagram F).</text>

  <!-- ============ Legend ============ -->
  <rect x="700" y="470" width="14" height="14" fill="#eef1fb" stroke="#2c3e6b" stroke-width="1.4"/>
  <text x="720" y="481" font-size="11.5" fill="#333">Rule-based / deterministic</text>
  <rect x="700" y="494" width="14" height="14" fill="#f6effa" stroke="#6b3fa0" stroke-width="1.4"/>
  <text x="720" y="505" font-size="11.5" fill="#333">Hybrid (rule + LoRA-tuned learned model)</text>
  <rect x="700" y="518" width="14" height="14" fill="#fafafa" stroke="#999" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="720" y="529" font-size="11.5" fill="#333">Decoupled process / not yet built</text>

  <text x="20" y="550" font-size="12" fill="#111">Fig. 1. Overall system architecture. Detections flow through a shared perception foundation before being</text>
</svg>
