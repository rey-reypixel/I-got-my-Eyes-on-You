<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="480" fill="#ffffff"/>

  <!-- States -->
  <circle cx="150" cy="200" r="72" fill="#eaf3ee" stroke="#2e7d5b" stroke-width="2"/>
  <text x="150" y="196" text-anchor="middle" font-size="16" font-weight="bold" fill="#1c4a35">ATTENDED</text>
  <text x="150" y="214" text-anchor="middle" font-size="10.5" fill="#3a6650">owner nearby</text>

  <circle cx="450" cy="200" r="72" fill="#fff6e6" stroke="#a66a00" stroke-width="2"/>
  <text x="450" y="196" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a4d00">WARNING</text>
  <text x="450" y="214" text-anchor="middle" font-size="10.5" fill="#8a5c00">timer running</text>

  <circle cx="750" cy="200" r="72" fill="#fbe9e7" stroke="#b3261e" stroke-width="2"/>
  <text x="750" y="196" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a1a15">ABANDONED</text>
  <text x="750" y="214" text-anchor="middle" font-size="10.5" fill="#8f231d">alert active</text>

  <!-- ATTENDED -> WARNING (top arc) -->
  <path d="M 195,150 Q 300,90 405,150" fill="none" stroke="#222" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="300" y="88" text-anchor="middle" font-size="12.5" fill="#111">distance &gt; d_disconnect</text>

  <!-- WARNING -> ATTENDED (bottom arc) -->
  <path d="M 405,250 Q 300,320 195,250" fill="none" stroke="#222" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="300" y="336" text-anchor="middle" font-size="12.5" fill="#111">distance &lt; d_reconnect</text>

  <!-- WARNING -> ABANDONED (top arc) -->
  <path d="M 495,150 Q 600,90 705,150" fill="none" stroke="#222" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="600" y="88" text-anchor="middle" font-size="12.5" fill="#111">timer &#8805; th_frames</text>

  <!-- ABANDONED -> ATTENDED (long bottom arc) -->
  <path d="M 705,255 Q 450,430 195,255" fill="none" stroke="#222" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="450" y="424" text-anchor="middle" font-size="12.5" fill="#111">distance &lt; d_reconnect</text>

  <!-- Hysteresis callout -->
  <rect x="230" y="410" width="440" height="46" rx="6" fill="#f4f4f7" stroke="#666" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="450" y="431" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">Hysteresis: d_disconnect &gt; d_reconnect</text>
  <text x="450" y="447" text-anchor="middle" font-size="11" fill="#555">two thresholds prevent flicker at a single shared boundary</text>

  <!-- WARNING timer note -->
  <rect x="378" y="264" width="144" height="34" rx="5" fill="#ffffff" stroke="#a66a00" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="450" y="285" text-anchor="middle" font-size="10.5" fill="#7a4d00">timer++ each frame in WARNING</text>

  <text x="20" y="30" font-size="12" fill="#111">Fig. 3. Abandoned-object state machine. Hysteresis (d_disconnect &gt; d_reconnect) prevents flicker at the</text>
  <text x="20" y="46" font-size="12" fill="#111">proximity threshold boundary (Section III-C).</text>
</svg>
